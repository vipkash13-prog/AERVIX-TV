name: Import NuvioTV upstream source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AERVIX TV
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify clean target
        run: |
          test ! -e app || { echo "Source already exists; refusing to overwrite"; exit 1; }
      - name: Download NuvioTV source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream-source
          curl --fail --location --retry 3 --output /tmp/nuvio-source.tar.gz \
            https://api.github.com/repos/NuvioMedia/NuvioTV/tarball/HEAD
          tar -xzf /tmp/nuvio-source.tar.gz --strip-components=1 -C upstream-source
      - name: Import source without overwriting project README
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' upstream-source/ ./
          rm -rf upstream-source
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import upstream NuvioTV source for AERVIX TV' || exit 0
          git push
