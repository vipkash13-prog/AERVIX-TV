name: AERVIX TV signed APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.AERVIX_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing keystore secret"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aervix-release.jks"
          test -s "$RUNNER_TEMP/aervix-release.jks"
      - name: Build signed release APK
        env:
          AERVIX_RELEASE_STORE_FILE: ${{ runner.temp }}/aervix-release.jks
          AERVIX_RELEASE_KEY_ALIAS: ${{ secrets.AERVIX_RELEASE_KEY_ALIAS }}
          AERVIX_RELEASE_KEY_PASSWORD: ${{ secrets.AERVIX_RELEASE_KEY_PASSWORD }}
          AERVIX_RELEASE_STORE_PASSWORD: ${{ secrets.AERVIX_RELEASE_STORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AERVIX-TV-signed-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
